<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ribbed Pillar Candles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e1a16;
    overflow: hidden;
  }

  /* 3D perspective wrapper — slight top-down view like the photo */
  .perspective {
    perspective: 900px;
    perspective-origin: 50% 30%;
  }

  .scene {
    position: relative;
    transform: rotateX(12deg);
    transform-style: preserve-3d;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 6px;
    padding: 80px 80px 0;
  }

  /* Stone / travertine base slab */
  .base {
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 200px;
    border-radius: 4px;
    transform-style: preserve-3d;
  }

  .base-top {
    width: 200px;
    height: 200px;
    background:
      radial-gradient(ellipse 40% 30% at 30% 40%, rgba(255,255,255,0.08) 0%, transparent 100%),
      radial-gradient(ellipse 50% 40% at 70% 60%, rgba(0,0,0,0.06) 0%, transparent 100%),
      linear-gradient(135deg, #d4c9b8 0%, #cec3b2 25%, #ddd2c2 50%, #c9bfaf 75%, #d8ccbc 100%);
    border-radius: 4px;
    box-shadow:
      0 2px 0 #b8ad9d,
      0 4px 0 #a89d8e,
      0 6px 0 #9a8f80,
      0 8px 0 #8e8374,
      0 10px 0 #847a6c,
      0 12px 20px rgba(0,0,0,0.4);
    position: relative;
  }

  /* Speckled texture on stone */
  .base-top::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 4px;
    background-image:
      radial-gradient(circle 1px at 20% 30%, rgba(0,0,0,0.1) 0%, transparent 100%),
      radial-gradient(circle 1px at 50% 20%, rgba(0,0,0,0.08) 0%, transparent 100%),
      radial-gradient(circle 1px at 80% 50%, rgba(0,0,0,0.07) 0%, transparent 100%),
      radial-gradient(circle 1px at 35% 70%, rgba(0,0,0,0.09) 0%, transparent 100%),
      radial-gradient(circle 1.5px at 65% 80%, rgba(0,0,0,0.06) 0%, transparent 100%);
  }

  .candle-group {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: flex-end;
    gap: 6px;
    z-index: 2;
  }

  .candle-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Candle body — built with individual ribs */
  .candle {
    position: relative;
    display: flex;
    overflow: hidden;
    border-radius: 0 0 1px 1px;
  }

  /* Individual rib */
  .rib {
    height: 100%;
    flex-shrink: 0;
  }

  /* Candle 1 — medium left */
  .candle-wrapper:nth-child(1) .candle { width: 56px; height: 180px; }
  .candle-wrapper:nth-child(1) .rib { width: 3.5px; }
  .candle-wrapper:nth-child(1) .candle-top { width: 56px; height: 22px; }

  /* Candle 2 — tall center */
  .candle-wrapper:nth-child(2) .candle { width: 64px; height: 260px; }
  .candle-wrapper:nth-child(2) .rib { width: 4px; }
  .candle-wrapper:nth-child(2) .candle-top { width: 64px; height: 26px; }

  /* Candle 3 — short right */
  .candle-wrapper:nth-child(3) .candle { width: 44px; height: 110px; }
  .candle-wrapper:nth-child(3) .rib { width: 2.75px; }
  .candle-wrapper:nth-child(3) .candle-top { width: 44px; height: 18px; }

  /* Rib shading — alternating light/shadow for 3D fluting */
  .rib {
    background: linear-gradient(
      to bottom,
      #efe5d4 0%,
      #f0e6d5 10%,
      #ede3d2 90%,
      #e8dcc9 100%
    );
  }
  .rib:nth-child(odd) {
    background: linear-gradient(
      to bottom,
      #e6dac7 0%,
      #e8dcc9 10%,
      #e4d8c5 90%,
      #ddd0bc 100%
    );
    box-shadow: inset 1px 0 0 rgba(255,255,255,0.15), inset -1px 0 0 rgba(0,0,0,0.08);
  }
  .rib:nth-child(even) {
    box-shadow: inset 1px 0 0 rgba(0,0,0,0.06), inset -1px 0 0 rgba(0,0,0,0.04);
  }

  /* Shadow gradient on left/right edges of candle for cylindrical look */
  .candle::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      90deg,
      rgba(0,0,0,0.12) 0%,
      rgba(0,0,0,0.03) 15%,
      transparent 30%,
      transparent 60%,
      rgba(0,0,0,0.04) 80%,
      rgba(0,0,0,0.15) 100%
    );
    z-index: 2;
    pointer-events: none;
  }

  /* Warm candlelight hitting the top portion */
  .candle::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(255, 200, 100, 0.12) 0%,
      rgba(255, 180, 80, 0.05) 20%,
      transparent 50%
    );
    z-index: 3;
    pointer-events: none;
  }

  /* Candle top — elliptical to show perspective */
  .candle-top {
    border-radius: 50%;
    position: relative;
    z-index: 4;
    margin-bottom: -4px;
  }

  .candle-top-surface {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 50%,
      #f2e8d8 0%,
      #ede1cf 40%,
      #e4d7c3 70%,
      #d8cbb7 100%
    );
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,0.08),
      inset 0 -1px 3px rgba(255,255,255,0.2),
      0 0 0 1px rgba(0,0,0,0.05);
  }

  /* Wax pool — slightly depressed center with warm glow */
  .wax-pool {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60%;
    height: 55%;
    border-radius: 50%;
    background: radial-gradient(ellipse,
      rgba(255, 220, 160, 0.35) 0%,
      rgba(245, 230, 200, 0.2) 50%,
      transparent 100%
    );
    box-shadow: inset 0 1px 4px rgba(180, 140, 80, 0.15);
  }

  /* Wick */
  .wick {
    position: relative;
    width: 2px;
    height: 12px;
    background: linear-gradient(to top, #4a4540, #1a1715);
    z-index: 5;
    border-radius: 1px 1px 0 0;
  }

  /* Flame assembly */
  .flame-container {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* Counter-rotate flames so they stay upright despite scene tilt */
    transform: rotateX(-12deg);
  }

  .flame {
    position: relative;
    width: 20px;
    height: 36px;
  }

  /* Outer flame */
  .flame-outer {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 14px;
    height: 30px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 80%,
      rgba(255, 200, 60, 0.9) 0%,
      rgba(255, 140, 20, 0.7) 30%,
      rgba(255, 80, 0, 0.3) 60%,
      transparent 100%
    );
    border-radius: 50% 50% 40% 40% / 80% 80% 20% 20%;
    filter: blur(0.8px);
    animation: flicker1 1.2s ease-in-out infinite alternate;
  }

  /* Inner flame — white/blue hot core */
  .flame-inner {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 6px;
    height: 18px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 85%,
      #fff 0%,
      #fff8e0 30%,
      rgba(255, 220, 130, 0) 100%
    );
    border-radius: 50% 50% 40% 40% / 80% 80% 20% 20%;
    filter: blur(0.3px);
    animation: flicker2 0.9s ease-in-out infinite alternate;
  }

  /* Flame tip — pointed top */
  .flame-tip {
    position: absolute;
    top: 0;
    left: 50%;
    width: 4px;
    height: 12px;
    transform: translateX(-50%);
    background: linear-gradient(to top,
      rgba(255, 160, 30, 0.6) 0%,
      rgba(255, 100, 0, 0.2) 50%,
      transparent 100%
    );
    border-radius: 50% 50% 30% 30% / 90% 90% 10% 10%;
    filter: blur(1px);
    animation: flicker-tip 0.7s ease-in-out infinite alternate;
  }

  /* Candle 2 bigger flame */
  .candle-wrapper:nth-child(2) .flame-outer {
    width: 16px; height: 34px;
    animation-delay: 0.3s;
  }
  .candle-wrapper:nth-child(2) .flame-inner {
    width: 7px; height: 20px;
    animation-delay: 0.25s;
  }

  /* Candle 3 smaller flame */
  .candle-wrapper:nth-child(3) .flame-outer {
    width: 11px; height: 24px;
    animation-delay: 0.6s;
  }
  .candle-wrapper:nth-child(3) .flame-inner {
    width: 5px; height: 14px;
    animation-delay: 0.55s;
  }

  /* Glow halos */
  .glow {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 80px;
    background: radial-gradient(circle,
      rgba(255, 180, 60, 0.2) 0%,
      rgba(255, 150, 30, 0.08) 40%,
      transparent 70%
    );
    border-radius: 50%;
    animation: glow-pulse 2.5s ease-in-out infinite alternate;
    pointer-events: none;
  }

  /* Ambient warm light on the whole scene */
  .ambient {
    position: fixed;
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 500px;
    background: radial-gradient(ellipse,
      rgba(255, 180, 80, 0.06) 0%,
      rgba(255, 140, 40, 0.02) 40%,
      transparent 70%
    );
    pointer-events: none;
    z-index: 0;
  }

  /* Subtle table surface with warm reflection */
  .table-surface {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 55%;
    background: linear-gradient(to bottom,
      rgba(40, 34, 28, 0) 0%,
      rgba(50, 42, 35, 0.3) 50%,
      rgba(60, 50, 40, 0.15) 100%
    );
    pointer-events: none;
  }

  /* Drop shadow under candle group */
  .candle-wrapper::after {
    content: '';
    position: absolute;
    bottom: -3px;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 6px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.2) 0%, transparent 70%);
    border-radius: 50%;
  }

  /* Animations */
  @keyframes flicker1 {
    0%   { transform: translateX(-50%) scaleX(1) scaleY(1) rotate(-0.5deg); opacity: 0.95; }
    20%  { transform: translateX(-50%) scaleX(0.94) scaleY(1.03) rotate(0.3deg); opacity: 1; }
    40%  { transform: translateX(-50%) scaleX(1.02) scaleY(0.97) rotate(-0.3deg); opacity: 0.97; }
    60%  { transform: translateX(-50%) scaleX(0.97) scaleY(1.01) rotate(0.5deg); opacity: 0.98; }
    80%  { transform: translateX(-50%) scaleX(1.01) scaleY(0.99) rotate(-0.2deg); opacity: 1; }
    100% { transform: translateX(-50%) scaleX(0.98) scaleY(1.02) rotate(0.4deg); opacity: 0.96; }
  }

  @keyframes flicker2 {
    0%   { transform: translateX(-50%) scaleX(1) scaleY(1); }
    33%  { transform: translateX(-50%) scaleX(0.9) scaleY(1.05); }
    66%  { transform: translateX(-50%) scaleX(1.05) scaleY(0.95); }
    100% { transform: translateX(-50%) scaleX(0.95) scaleY(1.03); }
  }

  @keyframes flicker-tip {
    0%   { transform: translateX(-50%) scaleY(1) rotate(-1deg); opacity: 0.7; }
    50%  { transform: translateX(-50%) scaleY(1.15) rotate(1deg); opacity: 0.5; }
    100% { transform: translateX(-50%) scaleY(0.9) rotate(-0.5deg); opacity: 0.65; }
  }

  @keyframes glow-pulse {
    0%   { opacity: 0.7; transform: translateX(-50%) scale(1); }
    100% { opacity: 1; transform: translateX(-50%) scale(1.1); }
  }
</style>
</head>
<body>

<div class="ambient"></div>
<div class="table-surface"></div>

<div class="perspective">
  <div class="scene">

    <div class="base">
      <div class="base-top"></div>
    </div>

    <div class="candle-group">
      <!-- Left candle (medium) -->
      <div class="candle-wrapper">
        <div class="flame-container">
          <div class="flame">
            <div class="flame-outer"></div>
            <div class="flame-inner"></div>
            <div class="flame-tip"></div>
            <div class="glow"></div>
          </div>
          <div class="wick"></div>
        </div>
        <div class="candle-top">
          <div class="candle-top-surface">
            <div class="wax-pool"></div>
          </div>
        </div>
        <div class="candle" id="candle1"></div>
      </div>

      <!-- Center candle (tallest) -->
      <div class="candle-wrapper">
        <div class="flame-container">
          <div class="flame">
            <div class="flame-outer"></div>
            <div class="flame-inner"></div>
            <div class="flame-tip"></div>
            <div class="glow"></div>
          </div>
          <div class="wick"></div>
        </div>
        <div class="candle-top">
          <div class="candle-top-surface">
            <div class="wax-pool"></div>
          </div>
        </div>
        <div class="candle" id="candle2"></div>
      </div>

      <!-- Right candle (short) -->
      <div class="candle-wrapper">
        <div class="flame-container">
          <div class="flame">
            <div class="flame-outer"></div>
            <div class="flame-inner"></div>
            <div class="flame-tip"></div>
            <div class="glow"></div>
          </div>
          <div class="wick"></div>
        </div>
        <div class="candle-top">
          <div class="candle-top-surface">
            <div class="wax-pool"></div>
          </div>
        </div>
        <div class="candle" id="candle3"></div>
      </div>
    </div>

  </div>
</div>

<script>
// Generate individual ribs for each candle for realistic fluting
function populateRibs(candle) {
  const w = candle.offsetWidth;
  const ribW = parseFloat(getComputedStyle(document.querySelector(`#${candle.id} .rib, .rib`) || candle).width) || 3.5;

  // Calculate from CSS
  let ribWidth;
  if (candle.id === 'candle1') ribWidth = 3.5;
  else if (candle.id === 'candle2') ribWidth = 4;
  else ribWidth = 2.75;

  const count = Math.ceil(w / ribWidth);
  const frag = document.createDocumentFragment();

  for (let i = 0; i < count; i++) {
    const rib = document.createElement('div');
    rib.className = 'rib';
    rib.style.width = ribWidth + 'px';

    // Vary brightness slightly per rib for realism
    const variation = Math.sin(i * 0.8) * 4;
    const base = 228 + variation;
    const baseD = 218 + variation;
    rib.style.background = (i % 2 === 0)
      ? `linear-gradient(to bottom, rgb(${base},${base-10},${base-26}) 0%, rgb(${base},${base-8},${base-22}) 50%, rgb(${baseD},${baseD-10},${baseD-24}) 100%)`
      : `linear-gradient(to bottom, rgb(${baseD},${baseD-8},${baseD-22}) 0%, rgb(${baseD-2},${baseD-10},${baseD-24}) 50%, rgb(${baseD-6},${baseD-14},${baseD-28}) 100%)`;

    if (i % 2 === 0) {
      rib.style.boxShadow = 'inset 1px 0 0 rgba(255,255,255,0.18), inset -1px 0 0 rgba(0,0,0,0.1)';
    } else {
      rib.style.boxShadow = 'inset 0 0 1px rgba(0,0,0,0.08)';
    }

    frag.appendChild(rib);
  }

  candle.appendChild(frag);
}

document.querySelectorAll('.candle').forEach(populateRibs);
</script>

</body>
</html>
